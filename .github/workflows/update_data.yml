name: Monthly Playlist Data Updater
on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      custom_genre:
        description: 'Create a specific genre on-demand'
        required: false
        type: string

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gemini-MusicBrainz Connector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python connector.py

      - name: Commit and Push the new JSON files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add *.json genres.txt locked_genres.txt
          git commit -m "Auto-update playlist data and genres" || echo "No changes to commit"
          git pull --rebase origin main
          git push
