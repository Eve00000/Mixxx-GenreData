name: Monthly Playlist Data Updater

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:
    inputs:
      custom_genre:
        description: 'Create a specific genre on-demand'
        required: false
        type: string

##concurrency:
#group: playlist-generator
#  cancel-in-progress: false
  
jobs:
  update-playlists:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gemini-MusicBrainz Connector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # THIS IS THE BRIDGE: It takes the input from your app and gives it to Python!
          CUSTOM_GENRE: ${{ inputs.custom_genre }}
        run: python connector.py

      - name: Commit and Push the new JSON files
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add *.json genres.txt locked_genres.txt requested_genres.txt
          git add -A
          git commit -m "Auto-update playlist data" || echo "No changes to commit"
          # Standard merge (no-rebase) with Union to keep both human and robot edits!
          git pull origin main --no-rebase -X union
          git push
