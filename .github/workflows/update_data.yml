name: "Chef: Playlist Data Updater"

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  # Allows you to manually force a batch run if needed
  workflow_dispatch:

# CRITICAL: This prevents multiple batch updaters from running at once
concurrency:
  group: playlist-batch-processor
  cancel-in-progress: false

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"        

      - name: Run Batch Update
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
          # We explicitly DO NOT pass CUSTOM_GENRE here so it triggers the batch logic
        run: python -u connector.py
