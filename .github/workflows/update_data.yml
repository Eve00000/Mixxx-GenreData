name: Playlist Data Updater

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      custom_genre:
        description: 'Create a specific genre on-demand'
        required: false
        type: string

##concurrency:
#group: playlist-generator
#  cancel-in-progress: false
  
jobs:
  update-playlists:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"        

      - name: Run Gemini-MusicBrainz Connector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
          CUSTOM_GENRE: ${{ inputs.custom_genre }}
        run: python -u connector.py

          # git pull origin main --no-rebase -X union
          # git push
